# Integração contínua: roda a cada push e a cada pull request.
# O build só fica verde se os dois quality gates passarem.

name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  qualidade:
    name: Quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar as dependências
        run: python -m pip install -r requirements.txt

      - name: "Quality gate 1: análise estática"
        run: python -m ruff check .

      - name: "Quality gate 2: testes com cobertura mínima de 80%"
        run: >
          python -m pytest
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Guardar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
